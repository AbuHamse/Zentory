<div class="flex flex-col gap-8 p-10 h-full overflow-y-auto custom-scrollbar bg-[#FFFBF7] animate-in fade-in duration-500">
  
  <div class="border-b-2 border-[#334155]/10 pb-4">
    <h1 class="text-5xl font-black text-[#334155] tracking-tighter italic">Settings</h1>
    
    <nav class="flex gap-8 mt-8">
      <button (click)="activeTab.set('ACCOUNT')" 
              [class.active-tab]="activeTab() === 'ACCOUNT'"
              class="pb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-[#334155]/40 hover:text-[#334155] transition-all">
        Account
      </button>
      <button (click)="activeTab.set('PREFERENCES')" 
              [class.active-tab]="activeTab() === 'PREFERENCES'"
              class="pb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-[#334155]/40 hover:text-[#334155] transition-all">
        Preferences
      </button>
      <button (click)="activeTab.set('PAYMENT')" 
              [class.active-tab]="activeTab() === 'PAYMENT'"
              class="pb-2 text-[11px] font-bold uppercase tracking-[0.2em] text-[#334155]/40 hover:text-[#334155] transition-all">
        Payment
      </button>
    </nav>
  </div>

  <div class="max-w-4xl space-y-12">
    
    <section>
      <h2 class="text-lg font-black text-[#334155] uppercase italic mb-1">Your Profile</h2>
      <p class="text-[11px] text-[#334155]/50 font-bold uppercase mb-6">Configure your system-wide identity.</p>
      
      <div class="flex gap-12 items-start">
        <div class="flex-1 space-y-6">
          <div class="flex flex-col gap-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-[#334155]">Name</label>
            <input [(ngModel)]="profileName" 
                   class="bg-white border-2 border-[#334155]/20 p-3 text-sm font-bold focus:border-[#334155] outline-none rounded-lg shadow-sm">
          </div>
          
          <div class="flex flex-col gap-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-[#334155]">Bio</label>
            <textarea [(ngModel)]="profileBio" rows="3"
                      class="bg-white border-2 border-[#334155]/20 p-3 text-sm font-bold focus:border-[#334155] outline-none rounded-lg shadow-sm resize-none"></textarea>
          </div>

          <button (click)="saveProfile()" 
                  class="px-6 py-2.5 bg-[#334155] text-white text-[10px] font-black uppercase tracking-widest rounded-lg hover:bg-[#A90011] transition-all shadow-md">
            Save_Changes
          </button>
        </div>

        <div class="w-32 flex flex-col items-center">
            <p class="text-[10px] font-black uppercase text-[#334155]/40 mb-4 italic">Profile_Visual</p>
            <div class="w-32 h-32 bg-[#FBE9D9] border-4 border-[#334155] rounded-full flex items-center justify-center text-3xl font-black text-[#334155] shadow-lg">
                D
            </div>
        </div>
      </div>
    </section>

    <section class="border-t-2 border-[#334155]/5 pt-12">
      <h2 class="text-lg font-black text-[#334155] uppercase italic mb-1">Email and Phone</h2>
      <p class="text-[11px] text-[#334155]/50 font-bold uppercase mb-8">Primary contact protocols for terminal notifications.</p>
      
      <div class="grid grid-cols-2 gap-8">
        <div class="flex flex-col gap-2">
            <label class="text-[10px] font-black uppercase text-[#334155]">Email_Address</label>
            <div class="flex gap-2">
                <input [(ngModel)]="email" class="flex-1 bg-white border-2 border-[#334155]/10 p-3 text-xs font-bold rounded-lg outline-none">
                <button class="px-4 bg-[#334155] text-white text-[9px] font-black uppercase rounded-lg">Update</button>
            </div>
        </div>
        <div class="flex flex-col gap-2">
            <label class="text-[10px] font-black uppercase text-[#334155]">Phone_Terminal</label>
            <div class="flex gap-2">
                <input [(ngModel)]="phone" class="flex-1 bg-white border-2 border-[#334155]/10 p-3 text-xs font-bold rounded-lg outline-none">
                <button class="px-4 bg-[#334155] text-white text-[9px] font-black uppercase rounded-lg">Update</button>
            </div>
        </div>
      </div>
      <p class="text-[9px] font-bold text-[#A90011] mt-4 uppercase tracking-tighter italic">
        * Multi-factor authentication required for phone protocol changes.
      </p>
    </section>

    <section class="border-t-2 border-[#334155]/5 pt-12 pb-20">
        <h2 class="text-lg font-black text-[#334155] uppercase italic mb-1">Password & Security</h2>
        <p class="text-[11px] text-[#334155]/50 font-bold uppercase mb-6">Manage your secure access credentials.</p>
        
        <button class="flex items-center gap-4 p-4 border-2 border-[#334155] rounded-xl hover:bg-[#334155]/5 transition-all w-full md:w-auto">
            <mat-icon class="text-[#A90011]">lock_reset</mat-icon>
            <span class="text-[10px] font-black uppercase tracking-widest text-[#334155]">Initialize_Password_Reset_Sequence</span>
        </button>
    </section>

  </div>
</div>
