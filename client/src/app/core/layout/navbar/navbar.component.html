<mat-toolbar class="h-14 bg-[#334155] text-white flex justify-between items-center p-0 shadow-lg relative z-50">
  
  <div class="flex items-center h-full">
    <button (click)="toggle()" 
            class="h-full px-5 flex items-center bg-[#A90011] hover:bg-[#D11D27] text-white transition-all border-r border-white/10">
      <mat-icon class="scale-75">menu</mat-icon>
    </button>
    
    <div class="flex items-center gap-6 px-6 h-full">
      <div class="flex items-center gap-4">
      
        
        <div class="hidden sm:block">
          <h1 class="text-xl font-semibold uppercase tracking-tighter leading-none select-none italic text-red-600">
            ZENTORY_OS
          </h1>
          <p class="text-[8px] font-bold uppercase tracking-[0.4em] mt-1 text-[#D11D27] leading-none">
            {{ version() }}
          </p>
        </div>
      </div>
      
      <div class="h-8 w-[1px] bg-white/10 hidden md:block"></div>
      <div class="hidden lg:flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
        <span class="text-[9px] font-black uppercase tracking-[0.2em] text-white/40 italic">
          Node_Status // SECURED
        </span>
      </div>
    </div>
  </div>

  <div class="flex items-center h-full px-6">
    
    <div class="h-8 w-[1px] bg-white/10 mx-4 hidden sm:block"></div>
    
    <button mat-button [matMenuTriggerFor]="profileMenu" 
            class="h-full flex items-center gap-4 hover:bg-white/5 transition-all text-white p-0">
      <div class="text-right hidden sm:block">
        <p class="text-[10px] font-black uppercase leading-none tracking-tighter italic">
          {{ currentUser().name }}
        </p>
        <p class="text-[8px] uppercase text-white/30 tracking-widest mt-1 italic">
          {{ currentUser().role }}
        </p>
      </div>
      
      <div class="w-10 h-10 bg-[#A90011] border-2 border-white/20 flex items-center justify-center font-black text-xs shadow-inner">
        {{ currentUser().initials }}
      </div>
    </button>

    <mat-menu #profileMenu="matMenu" class="zentory-menu">
      <button mat-menu-item class="hover:bg-[#FBE9D9]/10">
        <mat-icon class="scale-90 text-white/70">admin_panel_settings</mat-icon>
        <span class="font-black uppercase tracking-widest text-[10px]">Security_Vault</span>
      </button>
      <mat-divider class="!border-white/10"></mat-divider>
      <button mat-menu-item class="text-[#A90011] hover:bg-[#A90011]/5">
        <mat-icon class="scale-90 text-[#A90011]">power_settings_new</mat-icon>
        <span class="font-black uppercase tracking-widest text-[10px]">Terminal_Exit</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
