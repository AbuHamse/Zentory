<div class="bg-black border-4 border-black p-5 shadow-[8px_8px_0px_#213C64] text-white flex flex-col">
  
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-[10px] font-black uppercase tracking-[0.4em] opacity-50 italic">OUTBOUND_FLOW_VELOCITY</h3>
    <div class="flex gap-1">
      <div class="w-1 h-3 bg-wham-warn animate-pulse"></div>
      <div class="w-1 h-3 bg-wham-warn animate-pulse delay-75"></div>
      <div class="w-1 h-3 bg-wham-warn animate-pulse delay-150"></div>
    </div>
  </div>

  <div class="flex justify-between items-end mb-4">
    <div class="flex flex-col">
      <span class="text-6xl font-black italic leading-none tracking-tighter">
        {{ currentThroughput() }}
      </span>
      <span class="text-[9px] font-black uppercase opacity-40 mt-1">PALLETS_EXIT_TOTAL</span>
    </div>
    
    <div class="text-right pb-1">
      <p class="text-xs font-black text-wham-warn italic uppercase leading-none">Target</p>
      <p class="text-xl font-black leading-none">{{ HOURLY_TARGET }}</p>
    </div>
  </div>

  <div class="space-y-2">
    <div class="w-full h-6 bg-white/10 border-2 border-white/20 p-1 relative overflow-hidden">
      <div class="h-full bg-wham-primary shadow-[0_0_20px_#A90011] transition-all duration-1000 ease-out" 
           [style.width.%]="flowPercentage()">
      </div>
      
      <div class="absolute top-0 bottom-0 w-1 bg-wham-warn shadow-[0_0_10px_#E7C84B] z-10" style="left: 90%;"></div>
    </div>
    
    <div class="flex justify-between text-[8px] font-bold opacity-40 uppercase">
      <span>0_START</span>
      <span>90%_THRESHOLD</span>
      <span>100%_PEAK</span>
    </div>
  </div>

  <div class="mt-6 pt-4 border-t border-white/10">
    <div [class.text-wham-warn]="flowPercentage() < 60"
         class="text-[9px] font-black uppercase tracking-widest flex items-center gap-2">
      <span class="w-2 h-2 rounded-full" 
            [class.bg-wham-warn]="flowPercentage() < 60"
            [class.bg-green-500]="flowPercentage() >= 60"
            [class.animate-ping]="flowPercentage() < 60">
      </span>
      {{ getStatusMessage() }}
    </div>
  </div>
</div>
