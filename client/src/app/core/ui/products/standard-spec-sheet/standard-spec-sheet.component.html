<div class="w-full max-w-xl mx-auto transition-all duration-700" 
     [ngClass]="visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'">
  
  <div class="bg-white border-[3px] border-[#334155] p-12 rounded-[32px] 
              shadow-[30px_30px_60px_rgba(51,65,85,0.05),inset_-4px_-4px_12px_rgba(51,65,85,0.02)] 
              relative overflow-hidden group hover:scale-[1.005] transition-transform duration-500">
    
    <div class="flex justify-between items-start mb-12">
      <div class="bg-[#334155] text-white px-4 py-1.5 font-bold text-[9px] uppercase tracking-[0.3em] italic">
        Configuration: Professional_Core
      </div>
      <div class="w-10 h-10 bg-[#FBE9D9] rounded-full border-2 border-[#334155] flex items-center justify-center shadow-sm">
        <div class="w-2 h-2 bg-[#A90011] rounded-full animate-pulse"></div>
      </div>
    </div>

    <h3 class="text-5xl font-black uppercase italic tracking-tighter text-[#334155] mb-2 leading-none">Professional</h3>
    <p class="font-bold text-[11px] uppercase text-[#A90011] mb-12 tracking-[0.3em] italic">
      Foundational_Operational_Intelligence
    </p>

    <div class="space-y-8 mb-14">
      @for (feature of coreFeatures; track feature.label) {
        <div class="flex items-start gap-5 border-b border-[#334155]/10 pb-6 group/item">
          <div class="w-1.5 h-6 bg-[#A90011] opacity-30 group-hover/item:opacity-100 transition-all duration-300 mt-1"></div>
          <div>
            <h4 class="text-sm font-black uppercase tracking-tight text-[#334155] group-hover/item:translate-x-1 transition-transform">{{ feature.label }}</h4>
            <p class="text-[10px] font-bold uppercase text-[#334155]/40 mt-1 tracking-wide">{{ feature.detail }}</p>
          </div>
        </div>
      }
    </div>

    <button class="w-full bg-[#334155] text-white py-6 font-black uppercase italic text-lg 
                   shadow-[6px_6px_0px_#A90011] 
                   hover:bg-[#A90011] hover:shadow-none transition-all duration-300 active:translate-y-1">
      Deploy_Professional_Suite
    </button>

    <div class="absolute bottom-6 right-10 font-bold text-[9px] opacity-20 uppercase tracking-[0.3em] text-[#334155]">
      ZN-M1_Standard_Deployment_Model
    </div>
  </div>
</div>
