<section class="w-full py-16 bg-wham-tan-muted border-b-8 border-black flex flex-col items-center justify-center">
  
  <div class="mb-10 text-center">
    <h2 class="text-4xl font-black uppercase italic tracking-tighter text-black">SYSTEM_SPEC_SELECTOR</h2>
    <p class="font-mono text-[10px] font-black uppercase opacity-40 mt-2 tracking-[0.4em]">
      Current_Configuration: {{ activeTier }}_ENGINE
    </p>
  </div>

  <div class="bg-white border-4 border-black p-3 rounded-[24px] shadow-[10px_10px_0px_#000] flex gap-3 relative overflow-hidden">
    
    <button (click)="setTier('STANDARD')"
            class="relative px-10 py-4 font-black uppercase italic text-sm transition-all duration-300 rounded-[16px] z-10"
            [ngClass]="activeTier === 'STANDARD' 
              ? 'bg-black text-white shadow-[inset_0px_4px_8px_rgba(255,255,255,0.2)]' 
              : 'bg-transparent text-black hover:bg-wham-tan-light'">
      01_STANDARD
    </button>

    <button (click)="setTier('PREMIUM')"
            class="relative px-10 py-4 font-black uppercase italic text-sm transition-all duration-300 rounded-[16px] z-10"
            [ngClass]="activeTier === 'PREMIUM' 
              ? 'bg-wham-red-dark text-white shadow-[inset_0px_4px_8px_rgba(0,0,0,0.3)] scale-[1.05]' 
              : 'bg-transparent text-black hover:bg-wham-tan-light'">
      02_PREMIUM_TURBO
    </button>

    <div class="absolute top-0 right-0 p-1 opacity-10 pointer-events-none">
      <span class="font-mono text-[8px] font-black uppercase">REF_312</span>
    </div>
  </div>

</section>
