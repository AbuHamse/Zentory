<section class="w-full py-20 bg-[#FBE9D9] border-b-[6px] border-[#334155] flex flex-col items-center justify-center selection:bg-[#334155] selection:text-white">
  
  <div class="mb-12 text-center">
    <h2 class="text-4xl font-black uppercase italic tracking-tighter text-[#334155]">
      Enterprise_Deployment_Model
    </h2>
    <div class="flex items-center justify-center gap-3 mt-3">
      <div class="h-[1px] w-8 bg-[#A90011]"></div>
      <p class="font-bold text-[11px] font-black uppercase opacity-50 tracking-[0.3em] text-[#334155]">
        Active_Infrastructure: {{ activeTier }}_CORE
      </p>
      <div class="h-[1px] w-8 bg-[#A90011]"></div>
    </div>
  </div>

  <div class="bg-white border-[3px] border-[#334155] p-2.5 rounded-full shadow-[12px_12px_0px_rgba(51,65,85,0.08)] flex gap-2 relative overflow-hidden transition-all duration-500">
    
    <button (click)="setTier('STANDARD')"
            class="relative px-12 py-4 font-black uppercase italic text-[11px] tracking-widest transition-all duration-500 rounded-full z-10"
            [ngClass]="activeTier === 'STANDARD' 
              ? 'bg-[#334155] text-white shadow-lg translate-y-[-1px]' 
              : 'bg-transparent text-[#334155]/60 hover:bg-[#FBE9D9] hover:text-[#334155]'">
      01_Professional_Edition
    </button>

    <button (click)="setTier('PREMIUM')"
            class="relative px-12 py-4 font-black uppercase italic text-[11px] tracking-widest transition-all duration-500 rounded-full z-10"
            [ngClass]="activeTier === 'PREMIUM' 
              ? 'bg-[#A90011] text-white shadow-lg scale-[1.02] translate-y-[-1px]' 
              : 'bg-transparent text-[#334155]/60 hover:bg-[#FBE9D9] hover:text-[#334155]'">
      02_Enterprise_Elite
    </button>

    <div class="absolute top-0 right-6 p-1 opacity-[0.05] pointer-events-none">
      <span class="font-bold text-[8px] uppercase tracking-tighter text-[#334155]">MOD_CONFIG_v4</span>
    </div>
  </div>

  <p class="mt-10 text-[9px] font-bold uppercase tracking-[0.4em] text-[#334155]/30 italic">
    Scalable_Logic_Gate // Adaptive_Resource_Allocation
  </p>

</section>
