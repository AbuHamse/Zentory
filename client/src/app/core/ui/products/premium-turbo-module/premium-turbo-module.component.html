<div class="w-full max-w-xl mx-auto transition-all duration-700 delay-100" 
     [ngClass]="visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'">
  
  <div class="bg-wham-red-dark border-4 border-black p-10 rounded-[40px] 
              shadow-[25px_25px_50px_rgba(169,0,17,0.2),inset_10px_10px_20px_rgba(255,255,255,0.15),inset_-10px_-10px_20px_rgba(0,0,0,0.3)] 
              relative overflow-hidden group hover:scale-[1.02]">
    
    <div class="absolute -top-24 -left-24 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex justify-between items-start mb-10 relative z-10">
      <div class="bg-white text-black px-3 py-1 font-mono text-[9px] font-black uppercase italic tracking-widest">
        UNIT_TYPE: TURBO_02
      </div>
      <div class="flex gap-2">
        <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
        <div class="w-2 h-2 bg-white/20 rounded-full"></div>
      </div>
    </div>

    <h3 class="text-5xl font-black uppercase italic tracking-tighter text-white mb-2 relative z-10">PREMIUM_TURBO</h3>
    <p class="font-mono text-[10px] font-black uppercase text-wham-tan-light mb-10 tracking-[0.2em] relative z-10">
      High_Throughput_Neural_Engine
    </p>

    <div class="space-y-6 mb-12 relative z-10">
      @for (feature of turboFeatures; track feature.label) {
        <div class="flex items-start gap-4 border-b-2 border-white/10 pb-4 group/item">
          <div class="w-2 h-6 bg-white group-hover/item:bg-wham-tan-light transition-colors mt-1 shadow-[0_0_8px_#fff]"></div>
          <div>
            <h4 class="text-sm font-black uppercase tracking-tight text-white">{{ feature.label }}</h4>
            <p class="text-[10px] font-bold uppercase text-white/50">{{ feature.detail }}</p>
          </div>
        </div>
      }
    </div>

    <button class="w-full bg-white text-black py-5 font-black uppercase italic text-xl 
                   shadow-[8px_8px_0px_#000] 
                   hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all active:bg-wham-tan-light">
      ACTIVATE_TURBO_ACCESS
    </button>

    <div class="absolute bottom-4 right-8 font-mono text-[8px] text-white/20 uppercase tracking-widest">
      ZN-X2_ADVANCED_CONFIGURATION
    </div>
  </div>
</div>
