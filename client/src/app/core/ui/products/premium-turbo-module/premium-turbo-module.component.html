<div class="w-full max-w-xl mx-auto transition-all duration-700 delay-100" 
     [ngClass]="visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'">
  
  <div class="bg-[#A90011] border-[3px] border-[#334155] p-12 rounded-[32px] 
              shadow-[40px_40px_80px_rgba(169,0,17,0.15),inset_4px_4px_12px_rgba(255,255,255,0.1)] 
              relative overflow-hidden group hover:scale-[1.005] transition-transform duration-500">
    
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-white opacity-[0.08] rounded-full blur-[100px] pointer-events-none"></div>

    <div class="flex justify-between items-start mb-12 relative z-10">
      <div class="bg-white text-[#A90011] px-4 py-1.5 font-black text-[10px] uppercase tracking-[0.3em] italic shadow-sm">
        Configuration: Enterprise_Elite
      </div>
      <div class="flex gap-2.5">
        <div class="w-2.5 h-2.5 bg-white rounded-full animate-pulse shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
        <div class="w-2.5 h-2.5 bg-white/30 rounded-full"></div>
      </div>
    </div>

    <h3 class="text-5xl font-black uppercase italic tracking-tighter text-white mb-2 relative z-10 leading-none">Enterprise</h3>
    <p class="font-bold text-[11px] uppercase text-[#FBE9D9] mb-12 tracking-[0.3em] italic relative z-10">
      Strategic_Supply_Chain_Intelligence
    </p>

    <div class="space-y-8 mb-14 relative z-10">
      @for (feature of turboFeatures; track feature.label) {
        <div class="flex items-start gap-5 border-b border-white/10 pb-6 group/item">
          <div class="w-1.5 h-6 bg-[#FBE9D9] opacity-40 group-hover/item:opacity-100 group-hover/item:scale-y-110 transition-all duration-300 mt-1 shadow-[0_0_12px_rgba(251,233,217,0.4)]"></div>
          <div>
            <h4 class="text-sm font-black uppercase tracking-tight text-white group-hover/item:translate-x-1 transition-transform">{{ feature.label }}</h4>
            <p class="text-[10px] font-bold uppercase text-white/50 mt-1 tracking-wide">{{ feature.detail }}</p>
          </div>
        </div>
      }
    </div>

    <button class="w-full bg-white text-[#334155] py-6 font-black uppercase italic text-lg 
                   shadow-[8px_8px_0px_#334155] 
                   hover:bg-[#FBE9D9] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all duration-300">
      Request_Enterprise_Deployment
    </button>

    <div class="absolute bottom-6 right-10 font-bold text-[9px] text-white/30 uppercase tracking-[0.3em] italic">
      ZN-X2_Elite_Global_Specification
    </div>
  </div>
</div>
