<div class="fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
  <div class="bg-wham-tan border-[10px] border-black p-10 w-full max-w-3xl shadow-[30px_30px_0px_#E7C84B] animate-in zoom-in duration-300">
    
    <div class="flex justify-between items-start border-b-8 border-black pb-4 mb-8">
      <h2 class="text-5xl font-black uppercase italic tracking-tighter text-black">SUBMIT_REFUTE_CLAIM</h2>
      <button (click)="onCancel()" class="text-4xl font-black hover:text-wham-primary transition-colors">X</button>
    </div>
    
    <form [formGroup]="refuteForm" (ngSubmit)="onSubmit()" class="grid grid-cols-2 gap-6 text-black">
      
      <div class="col-span-1">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">INTERVAL_SLOT (1-6)</label>
        <input type="number" formControlName="intervalSlot" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none">
      </div>

      <div class="col-span-1">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">CATEGORY_TYPE</label>
        <select formControlName="category" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none">
          <option value="LABOR_SHARE">LABOR_SHARE</option>
          <option value="EQUIPMENT_ISSUE">EQUIPMENT_ISSUE</option>
          <option value="SAFETY_STOP">SAFETY_STOP</option>
          <option value="MEETING">MEETING</option>
        </select>
      </div>

      <div class="col-span-1">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">START_TIME</label>
        <input type="time" formControlName="startTime" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none">
      </div>
      <div class="col-span-1">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">END_TIME</label>
        <input type="time" formControlName="endTime" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none">
      </div>

      <div class="col-span-2">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">ASSIGNED_DEPARTMENT_OVERRIDE</label>
        <input type="text" formControlName="department" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none" placeholder="E.G. INBOUND_GATE / RETURNS_RECOVERY">
      </div>

      <div class="col-span-2">
        <label class="block font-black uppercase text-[10px] mb-2 tracking-widest">DETAILED_JUSTIFICATION</label>
        <textarea formControlName="explanation" rows="3" class="w-full border-4 border-black p-4 bg-white font-black focus:bg-wham-cream outline-none" placeholder="Provide system context..."></textarea>
      </div>

      <div class="col-span-2 flex gap-4 mt-6">
        <button type="submit" [disabled]="!refuteForm.valid" 
                class="flex-1 bg-black text-white p-6 font-black uppercase text-2xl hover:bg-wham-primary disabled:opacity-20 disabled:cursor-not-allowed transition-all shadow-[8px_8px_0px_#A90011] active:shadow-none active:translate-y-1">
          COMMIT_TO_SYSTEM
        </button>
        <button type="button" (click)="onCancel()" 
                class="bg-wham-warn border-4 border-black px-10 font-black uppercase italic hover:bg-black hover:text-white transition-all">
          ABORT
        </button>
      </div>

    </form>
  </div>
</div>
