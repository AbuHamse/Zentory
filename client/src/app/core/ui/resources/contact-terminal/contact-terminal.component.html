<section class="w-full py-24 bg-black text-white border-b-8 border-black selection:bg-wham-red-main">
  <div class="max-w-4xl mx-auto px-8">
    
    <div class="mb-12 border-l-4 border-wham-red-dark pl-6">
      <h3 class="text-4xl font-black uppercase italic tracking-tighter">ACCESS_REQUEST_TERMINAL</h3>
      <p class="font-mono text-[10px] font-black uppercase opacity-40 mt-2 tracking-widest">
        Secure_Channel // Encryption: AES-256
      </p>
    </div>

    <div class="bg-white/5 border-2 border-white/10 p-10 font-mono">
      <form class="space-y-8" (ngSubmit)="submitRequest()">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-2">
            <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">_OPERATOR_NAME</label>
            <input type="text" placeholder="ENTER_IDENTITY" 
                   class="w-full bg-black border border-white/20 p-4 text-sm focus:border-wham-red-main outline-none transition-colors uppercase">
          </div>
          <div class="space-y-2">
            <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">_COMMS_ADDRESS</label>
            <input type="email" placeholder="ENTER_EMAIL" 
                   class="w-full bg-black border border-white/20 p-4 text-sm focus:border-wham-red-main outline-none transition-colors uppercase">
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[9px] font-black opacity-40 uppercase tracking-widest">_TRANSMISSION_CONTENT</label>
          <textarea rows="4" placeholder="SPECIFY_QUERY_OR_REASON_FOR_ACCESS" 
                    class="w-full bg-black border border-white/20 p-4 text-sm focus:border-wham-red-main outline-none transition-colors uppercase"></textarea>
        </div>

        <button type="submit" 
                class="w-full bg-wham-red-dark text-white py-4 font-black uppercase italic text-xl shadow-[6px_6px_0px_#fff] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all">
          SEND_TRANSMISSION
        </button>

      </form>
    </div>
  </div>
</section>
